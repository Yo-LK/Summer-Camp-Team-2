<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CampusBot</title>
    <link rel="stylesheet" href="/static/style.css?v=starter-reference-ui" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">CB</div>
          <div>
            <p class="brand-kicker">LOCAL CAMPUS ASSISTANT</p>
            <h1>CampusBot</h1>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="connection-status" aria-live="polite">
            <span id="connectionDot" class="status-dot is-checking" aria-hidden="true"></span>
            <span id="connectionLabel">Checking connection</span>
          </div>
          <button id="newChatButton" class="quiet-button" type="button">New chat</button>
        </div>
      </header>

      <main class="chat-layout">
        <section id="conversation" class="conversation" aria-live="polite" aria-label="Conversation"></section>

        <form id="chatForm" class="composer">
          <label class="sr-only" for="messageInput">Message</label>
          <textarea
            id="messageInput"
            rows="1"
            maxlength="12000"
            placeholder="Ask a question in natural language..."
            autocomplete="off"
          ></textarea>
          <button id="sendButton" class="send-button" type="submit">Send</button>
        </form>
        <p class="composer-note">Starter project. Responses are generated by the local model.</p>
      </main>
    </div>

    <template id="welcomeTemplate">
      <div class="welcome-panel">
        <div class="welcome-rule"></div>
        <p class="welcome-kicker">READY WHEN YOU ARE</p>
        <h2>How can I help?</h2>
        <p class="welcome-copy">Explore Shenzhen University facts, campuses, libraries, and AI translation.</p>
        <div class="suggestion-grid" aria-label="Suggested questions">
          <button class="suggestion" type="button" data-message="What is Shenzhen University's motto?">What is Shenzhen University's motto?</button>
          <button class="suggestion" type="button" data-message="When was Shenzhen University founded?">When was Shenzhen University founded?</button>
          <button class="suggestion" type="button" data-message="What are Shenzhen University's two campuses?">What are Shenzhen University's two campuses?</button>
          <button class="suggestion" type="button" data-message="What are the main branches of Shenzhen University Library?">What are the main branches of Shenzhen University Library?</button>
          <button class="suggestion" type="button" data-message="Translate &quot;Welcome to Shenzhen University&quot; into Chinese.">Translate “Welcome to Shenzhen University” into Chinese.</button>
          <button class="suggestion" type="button" data-message="Where is Shenzhen University Library?">Where is Shenzhen University Library?</button>
        </div>
      </div>
    </template>

    <script src="/static/app.js?v=starter-reference-ui" defer></script>
  </body>
</html>
